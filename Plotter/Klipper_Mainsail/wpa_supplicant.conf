ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
country=UK # Change to your country ID if not in the UK
update_config=1

network={
        scan_ssid=1 # Used to find hidden SSID's
        ssid="<WIFI_NAME>" # Change to your wifi name
        psk="<WIFI_PASSWORD>" # Change to your wifi password
        proto=RSN # this setting should work on most home networks
        key_mgmt=WPA-PSK # this setting should work on most home networks
        pairwise=CCMP # this setting should work on most home networks
        auth_alg=OPEN # this setting should work on most home networks
}

# Make sure this file is called wpa_supplicant.conf
# and place it in the root directory of your RPi
# (usually D drive, called bootfs). When you boot
# your RPi, it will automatically set up wpa and 
# connect to your wifi. You will need to do this
# every time you change network.

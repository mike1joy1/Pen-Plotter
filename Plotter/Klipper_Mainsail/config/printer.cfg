[include mainsail.cfg]

# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v3.0. To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" and USB communication/USART.

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.

########## SETUP STEPPERS ##########

[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 39.92 # normal: 39.92, 1 page size down: 56.46, 1 page size up 28.23
endstop_pin: ^PC0
position_min: 0
position_endstop: 0
position_max: 380 # normal: 380
homing_speed: 100

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.55
hold_current: 0.55
stealthchop_threshold: 999999

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40 # normal: 40, 1 page size down: 56.57, 1 page size up 28.28
endstop_pin: ^PC1
position_min: 0
position_endstop: 0
position_max: 560 # normal: 560, 1 page size down: 791, 1 page size up 395
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.7
hold_current: 0.7
stealthchop_threshold: 999999

[stepper_y1]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 40 # normal: 40, 1 page size down: 56.57, 1 page size up 28.28

[tmc2209 stepper_y1]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.7
hold_current: 0.7
stealthchop_threshold: 999999

# Need to have this because of the kinematics...
[stepper_z]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 8
position_endstop: 0.0
endstop_pin: ^PC2
position_max: 250
position_min: -2

[skew_correction]

[gcode_macro _SKEW]
gcode:
  SET_SKEW XY=140.8,141.9,99.7

########## SETUP SERVOS ##########

[servo servo0]
pin: PA8
maximum_servo_angle: 180
minimum_pulse_width: 0.0005 # The minimum pulse width time (in seconds)
maximum_pulse_width: 0.0024 # The maximum pulse width time (in seconds)
initial_angle: 95
#initial_pulse_width:

[servo servo1]
pin: PA1
maximum_servo_angle: 180
minimum_pulse_width: 0.0005 # The minimum pulse width time (in seconds)
maximum_pulse_width: 0.0024 # The maximum pulse width time (in seconds)
initial_angle: 95
#initial_pulse_width:

# Control with:
#   SET_SERVO SERVO=servo0 ANGLE=180

[gcode_macro PEN_NEU_0]
gcode:
  SET_SERVO SERVO=servo0 ANGLE=95

[gcode_macro PEN_NEU_1]
gcode:
  PEN_NEU_0

[gcode_macro PEN_NEU_2]
gcode:
  SET_SERVO SERVO=servo1 ANGLE=95

[gcode_macro PEN_NEU_3]
gcode:
  PEN_NEU_2

[gcode_macro PEN_UP_0]
gcode:
  SET_SERVO SERVO=servo0 ANGLE=125

[gcode_macro PEN_UP_1]
gcode:
  SET_SERVO SERVO=servo0 ANGLE=65

[gcode_macro PEN_UP_2]
gcode:
  SET_SERVO SERVO=servo1 ANGLE=125

[gcode_macro PEN_UP_3]
gcode:
  SET_SERVO SERVO=servo1 ANGLE=72

[gcode_macro PEN_DOWN_0]
gcode:
  SET_SERVO SERVO=servo0 ANGLE=145

[gcode_macro PEN_DOWN_1]
gcode:
  SET_SERVO SERVO=servo0 ANGLE=45

[gcode_macro PEN_DOWN_2]
gcode:
  SET_SERVO SERVO=servo1 ANGLE=140

[gcode_macro PEN_DOWN_3]
gcode:
  SET_SERVO SERVO=servo1 ANGLE=61

[gcode_macro PEN_NEU_ALL]
gcode:
  PEN_NEU_0
  PEN_NEU_2
  G4 P500

[gcode_macro SERVO_0]
gcode:
  {% set ang = params.A|int %}
  SET_SERVO SERVO=servo0 ANGLE={ang}

[gcode_macro SERVO_1]
gcode:
  {% set ang = params.A|int %}
  SET_SERVO SERVO=servo1 ANGLE={ang}

[gcode_macro PEN]
gcode:
  {% set pen = params.T|int %}
  {% set pos = params.P|int %}
  
  {% if pen == 0 %}
    {% if pos == 0 %}
      PEN_NEU_2
      PEN_NEU_0
    {% endif %}
    {% if pos == 1 %}
      PEN_NEU_2
      PEN_UP_0
    {% endif %}
    {% if pos == 2 %}
      PEN_NEU_2
      PEN_DOWN_0
    {% endif %}
  {% endif %}

  {% if pen == 1 %}
    {% if pos == 0 %}
      PEN_NEU_2
      PEN_NEU_1
    {% endif %}
    {% if pos == 1 %}
      PEN_NEU_2
      PEN_UP_1
    {% endif %}
    {% if pos == 2 %}
      PEN_NEU_2
      PEN_DOWN_1
    {% endif %}
  {% endif %}

  {% if pen == 2 %}
    {% if pos == 0 %}
      PEN_NEU_0
      PEN_NEU_2
    {% endif %}
    {% if pos == 1 %}
      PEN_NEU_0
      PEN_UP_2
    {% endif %}
    {% if pos == 2 %}
      PEN_NEU_0
      PEN_DOWN_2
    {% endif %}
  {% endif %}

  {% if pen == 3 %}
    {% if pos == 0 %}
      PEN_NEU_0
      PEN_NEU_3
    {% endif %}
    {% if pos == 1 %}
      PEN_NEU_0
      PEN_UP_3
    {% endif %}
    {% if pos == 2 %}
      PEN_NEU_0
      PEN_DOWN_3
    {% endif %}
  {% endif %}

  G4 P250 # delay in ms

########## PRINTER CONTROL SETTINGS ##########

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_21003D000250415339373620-if00
# serial: /dev/ttyAMA0
# restart_method: command

[printer]
kinematics: cartesian
max_velocity: 250 # F14000 Max, F10000 standard
max_accel: 1000
max_z_velocity: 250
max_z_accel: 1000

# Board cooling fan
[temperature_fan controllerFan0]
pin: PC6
sensor_type: temperature_mcu
sensor_mcu: mcu
control: watermark
min_temp: 10
max_temp: 65
target_temp: 35

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

########## CUSTOM HOMING ##########
[force_move]
enable_force_move: True

[homing_override]
axes: xyz
gcode:
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

  PEN_NEU_ALL
  G4 P500
  
  {% if home_all or 'X' in params %}
    M117 Homing X...
    G28 X
    G0 X0 F5000
  {% endif %}
  
  {% if home_all or 'Y' in params %}
    M117 Homing Y...
    G28 Y
    G0 Y0 F5000
  {% endif %}
  
  {% if home_all or 'Z' in params %}
    SET_KINEMATIC_POSITION Z=0
  {% endif %}

  TRAV_COMF
  
  _SKEW


########## GET AND SET SPEEDS ##########
[gcode_macro SET_SPEEDS]
variable_travel_speed: 1000
variable_feed_speed: 1000
gcode:
  {% set t = params.G0|int %}
  {% set f = params.G1|int %}
  
  SET_GCODE_VARIABLE MACRO=SET_SPEEDS VARIABLE=travel_speed VALUE={t}
  SET_GCODE_VARIABLE MACRO=SET_SPEEDS VARIABLE=feed_speed VALUE={f}

[gcode_macro _F0]
gcode:
  G0 F{printer["gcode_macro SET_SPEEDS"].travel_speed}

[gcode_macro _F1]
gcode:
  G1 F{printer["gcode_macro SET_SPEEDS"].feed_speed}

########## USEFUL MACROS ##########

[gcode_macro CLEAR_A5]
gcode:
  M117 Clearing draw area...
  PEN_NEU_ALL
  G4 P500
  G0 Y240 F4000
  M117

[gcode_macro CLEAR_A4]
gcode:
  M117 Clearing draw area...
  PEN_NEU_ALL
  G4 P500
  G0 Y327 F4000
  M117

[gcode_macro CLEAR_A3]
gcode:
  M117 Clearing draw area...
  PEN_NEU_ALL
  G4 P500
  G0 Y450 F4000
  M117

[gcode_macro DRAW_REF]
gcode:
  {% set pen = params.T|int %}

  PEN_NEU_ALL
  G0 X40 Y40
  
  PEN T={pen} P=1
  G0 X0 Y50
  PEN T={pen} P=2
  G1 X0 Y200
  
  PEN T={pen} P=1
  G0 X50 Y0
  PEN T={pen} P=2
  G1 X200 Y0
  
  PEN_NEU_ALL

[gcode_macro GO_TO_TR]
gcode:
  G0 X380 Y560 # normal: Y560, 1 page size down: Y791, 1 page size up Y395

[gcode_macro GO_TO_BR]
gcode:
  G0 X380 Y0 # normal: Y560, 1 page size down: Y791, 1 page size up Y395

[gcode_macro GO_TO_TL]
gcode:
  G0 X0 Y560 # normal: Y560, 1 page size down: Y791, 1 page size up Y395

[gcode_macro GO_TO_BL]
gcode:
  G0 X0 Y0

[gcode_macro GO_TO_MID]
gcode:
  G0 X190 Y280

[gcode_macro TRAV_MAX]
gcode:
  G0 F14000

[gcode_macro TRAV_COMF]
gcode:
  G0 F10000

[gcode_macro RESET_OFFSETS]
gcode:
  SET_GCODE_OFFSET X=0 Y=0 Z=0

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
  PEN_NEU_ALL
  BASE_PAUSE

[gcode_macro SWITCH_TO_T_ONE]
gcode:
  SET_GCODE_OFFSET X_ADJUST=-22.125 Y_ADJUST=0

[gcode_macro TEST_T_X]
gcode:
  G1 X100 Y100
  
  PEN T=0 P=1
  G4 P2000
  
  PEN T=0 P=2
  G1 X100 Y200
  PEN T=0 P=0
  
  SWITCH_TO_T_ONE

  G1 X100 Y75
  
  PEN T=1 P=1
  G4 P2000
  
  PEN T=1 P=2
  G1 X100 Y175
  PEN T=1 P=0
  
  SET_GCODE_OFFSET X=0 Y=0

[gcode_macro TEST_T_Y]
gcode:
  G1 X100 Y100
  
  PEN T=0 P=1
  G4 P2000
  
  PEN T=0 P=2
  G1 X200 Y100
  PEN T=0 P=0
  
  SWITCH_TO_T_ONE

  G1 X75 Y100
  
  PEN T=1 P=1
  G4 P2000
  
  PEN T=1 P=2
  G1 X175 Y100
  PEN T=1 P=0
  
  SET_GCODE_OFFSET X=0 Y=0

